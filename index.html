<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Recipe Generator</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">
        <button id="themeToggle">🌙</button>
        <h1>🍳 AI Recipe Generator</h1>

        <p>Turn ingredients into delicious recipes instantly</p>

        <div class="search-box">
            <button id="viewFavoritesBtn">
                ❤️ View Favorites
            </button>

            <input type="text" id="searchInput" placeholder="Enter ingredients...">

            <button onclick="getRecipes()">Generate</button>
           

        </div>

        <!-- Main Page -->
        <div id="mainPage">

            <!-- Results -->
            <div id="results"></div>

            <!-- Favorites -->
            <div id="favoritesSection">

                <h2>❤️ Favorite Recipes</h2>

                <div id="favorites"></div>

            </div>

        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
